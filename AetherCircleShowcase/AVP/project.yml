name: AetherCircleShowcase
options:
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "2.0"
fileGroups:
  - Assets.xcassets
  - Info.plist
packages:
  AetherCircle:
    url: "https://github.com/Zodiac-Innovations/AetherCircleDevelopment.git"
    branch: "main"
targets:
  AetherCircleShowcase:
    type: application
    platform: visionOS
    info:
      path: Info.plist
      properties:
        AetherVoiceControlEnabled: true
        NSMicrophoneUsageDescription: "Say Showcase followed by a navigation command to control the app."
        NSSpeechRecognitionUsageDescription: "Recognize spoken Showcase navigation commands."
        NSHumanReadableCopyright: "© 2026 Zodiac Innovations. All rights reserved."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    sources:
      - path: Sources
      - path: ../Shared/Swift
        name: Shared
        type: syncedFolder
      - path: ../Shared/Files
        name: Files
        type: syncedFolder
      - path: Assets.xcassets
        name: Assets.xcassets
        group: Resources
        type: file
        buildPhase: resources
      - path: Info.plist
        name: Info.plist
        group: Resources
        type: file
        buildPhase: none
    dependencies:
      - package: AetherCircle
        product: AetherCircleCore
      - package: AetherCircle
        product: AetherCircleAVP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zodiacinnovations.aethercircleshowcase
        PRODUCT_NAME: "AetherCircle Showcase"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
